name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
          - platform: "windows-latest"
            args: "--target aarch64-pc-windows-msvc"
          - platform: "ubuntu-24.04"
            args: ""
          - platform: "ubuntu-24.04-arm"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev libsoup2.4-dev javascriptcoregtk-4.0 webkit2gtk-4.0 xdg-utils

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets:
            ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' ||
            '' }}

      - name: Install macOS Rust targets
        if: contains(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: pnpm Setup
        uses: pnpm/action-setup@v4

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm" # Set this to npm, yarn or pnpm.

      - name: Install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: pnpm install # Change this to npm, yarn or pnpm.

      - name: Install Rust targets
        if: matrix.platform == 'windows-latest'
        run: rustup target add aarch64-pc-windows-msvc x86_64-pc-windows-msvc

      - name: Determine Windows bundle targets
        if: contains(matrix.platform, 'windows')
        id: win-bundles
        shell: bash
        run: |
          # If version has a non-numeric pre-release (e.g. beta), skip MSI (WiX requires numeric-only)
          ARGS=$(node -e "
            const v = require('./apps/tauri/tauri.conf.json').version;
            console.log(/\-.*[a-zA-Z]/.test(v) ? '--bundles nsis' : '');
          ")
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Build the app
        uses: tauri-apps/tauri-action@v0

        env:
          # Wealthfolio Connect (set variables to enable; omit to build without Connect)
          CONNECT_AUTH_URL: ${{ vars.CONNECT_AUTH_URL }}
          CONNECT_AUTH_PUBLISHABLE_KEY: ${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
          CONNECT_API_URL: ${{ vars.CONNECT_API_URL }}
          CONNECT_OAUTH_CALLBACK_URL: ${{ vars.CONNECT_OAUTH_CALLBACK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple code signing disabled (no Developer account). Using ad-hoc
          # signing via tauri.conf.json signingIdentity "-". macOS users may
          # need ctrl+click > Open on first launch.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # Password decrypts the signing key. If your TAURI_PRIVATE_KEY was
          # generated with `tauri signer generate -p ""` (no password) you can
          # leave this secret unset; tauri-action treats missing as empty.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }} # This only works if the workflow triggers on new tags.
          releaseName: "Donkeyfolio v__VERSION__" # tauri-action replaces \_\_VERSION\_\_ with the app version.
          releaseBody: "See the assets to download and install this version."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.win-bundles.outputs.args }}

  generate-updater-manifest:
    # After all matrix builds finish, generate latest.json from the .sig files
    # already uploaded to the release by tauri-action, then upload it as a
    # release asset. The Tauri updater plugin fetches this file to decide
    # whether a new version is available and to verify the signature.
    needs: release
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          export VERSION="${TAG#v}"
          export BASE="https://github.com/${REPO}/releases/download/${TAG}"
          WORK="$(mktemp -d)"

          # Fetch the release assets list
          gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' > "$WORK/assets.txt"
          echo "=== Available assets ==="
          cat "$WORK/assets.txt"

          # Helper: download a .sig file (if present) and emit its contents (base64).
          # Empty pkg name → returns empty.
          get_sig() {
            local pkg="$1"
            [ -z "$pkg" ] && { echo ""; return 0; }
            local name="${pkg}.sig"
            if grep -qx "$name" "$WORK/assets.txt"; then
              gh release download "$TAG" -R "$REPO" -p "$name" -D "$WORK" --skip-existing >/dev/null 2>&1 || true
              [ -f "$WORK/$name" ] && cat "$WORK/$name" || echo ""
            else
              echo ""
            fi
          }

          # Detect platform-specific asset names from what tauri-action uploaded.
          export MAC_ARM_TAR=$(grep -E '^Donkeyfolio_.*aarch64\.app\.tar\.gz$' "$WORK/assets.txt" | head -1 || true)
          export MAC_ARM_SIG=$(get_sig "$MAC_ARM_TAR")
          export MAC_X64_TAR=$(grep -E '^Donkeyfolio_.*(x64|x86_64)\.app\.tar\.gz$' "$WORK/assets.txt" | head -1 || true)
          export MAC_X64_SIG=$(get_sig "$MAC_X64_TAR")
          export WIN_ARM_PKG=$(grep -E '^Donkeyfolio_.*arm64.*\.(nsis|msi)\.zip$' "$WORK/assets.txt" | head -1 || true)
          export WIN_ARM_SIG=$(get_sig "$WIN_ARM_PKG")
          export WIN_X64_PKG=$(grep -E '^Donkeyfolio_.*(x64|x86_64).*\.(nsis|msi)\.zip$' "$WORK/assets.txt" | head -1 || true)
          export WIN_X64_SIG=$(get_sig "$WIN_X64_PKG")
          export LIN_X64_PKG=$(grep -E '^Donkeyfolio_.*amd64\.AppImage(\.tar\.gz)?$' "$WORK/assets.txt" | head -1 || true)
          export LIN_X64_SIG=$(get_sig "$LIN_X64_PKG")

          export PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export NOTES="Donkeyfolio v${VERSION}. See assets to download and install."

          node <<'EOF' > latest.json
          const e = process.env;
          const mk = (sig, pkg) => (sig && pkg)
            ? { signature: sig, url: `${e.BASE}/${pkg}` }
            : null;
          const platforms = {};
          const macArm = mk(e.MAC_ARM_SIG, e.MAC_ARM_TAR);
          if (macArm) { platforms['darwin-aarch64'] = macArm; platforms['darwin-aarch64-app'] = macArm; }
          const macX64 = mk(e.MAC_X64_SIG, e.MAC_X64_TAR);
          if (macX64) { platforms['darwin-x86_64'] = macX64; platforms['darwin-x86_64-app'] = macX64; }
          const winArm = mk(e.WIN_ARM_SIG, e.WIN_ARM_PKG);
          if (winArm) platforms['windows-aarch64'] = winArm;
          const winX64 = mk(e.WIN_X64_SIG, e.WIN_X64_PKG);
          if (winX64) platforms['windows-x86_64'] = winX64;
          const linX64 = mk(e.LIN_X64_SIG, e.LIN_X64_PKG);
          if (linX64) platforms['linux-x86_64'] = linX64;
          console.log(JSON.stringify({
            version: e.VERSION,
            notes: e.NOTES,
            pub_date: e.PUB_DATE,
            platforms,
          }, null, 2));
          EOF

          echo "=== Generated latest.json ==="
          cat latest.json

          # Upload (replace if exists)
          gh release upload "$TAG" latest.json -R "$REPO" --clobber

  prebuild-server-linux:
    # Standalone server tarball for self-hosters (Proxmox LXC, bare metal, systemd).
    # Tracks: https://github.com/wealthfolio/wealthfolio/issues/563
    # Built on ubuntu-22.04 (glibc 2.35) for forward compatibility with Debian 12+/Ubuntu 22.04+.
    needs: release
    # Run even if some matrix entries in `release` failed (fail-fast is off).
    # Only skip on explicit cancellation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev build-essential

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: prebuild-server-linux-amd64

      - name: pnpm setup
        uses: pnpm/action-setup@v4

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (web target)
        env:
          BUILD_TARGET: web
          CONNECT_AUTH_URL: ${{ vars.CONNECT_AUTH_URL }}
          CONNECT_AUTH_PUBLISHABLE_KEY: ${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
        run: pnpm --filter frontend... build

      - name: Build server binary
        env:
          OPENSSL_STATIC: "1"
          CONNECT_AUTH_URL: ${{ vars.CONNECT_AUTH_URL }}
          CONNECT_AUTH_PUBLISHABLE_KEY: ${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
          CONNECT_API_URL: ${{ vars.CONNECT_API_URL }}
        run: cargo build --release --manifest-path apps/server/Cargo.toml

      - name: Verify server binary runtime dependencies
        run: |
          ldd target/release/wealthfolio-server
          if ldd target/release/wealthfolio-server | grep -E 'lib(ssl|crypto)\.so'; then
            echo "Server binary still links dynamically to OpenSSL"
            exit 1
          fi

      - name: Stage tarball contents
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="wealthfolio-server-${VERSION}-linux-amd64"
          mkdir -p "${STAGE}"
          cp target/release/wealthfolio-server "${STAGE}/wealthfolio-server"
          cp -r dist "${STAGE}/dist"
          cp LICENSE "${STAGE}/LICENSE" 2>/dev/null || true
          cp packaging/server-prebuild/wealthfolio.service.example "${STAGE}/wealthfolio.service.example"
          cp packaging/server-prebuild/README.md "${STAGE}/README.md"

      - name: Create tarball + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="wealthfolio-server-${VERSION}-linux-amd64"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            wealthfolio-server-*-linux-amd64.tar.gz
            wealthfolio-server-*-linux-amd64.tar.gz.sha256
